# Copiar a config.properties para conectar una base MySQL o MariaDB migrada.
# Sin config.properties se utiliza una base H2 local persistente con datos de ejemplo.
# MySQL remoto: jdbc:mysql://HOST:3306/BASE?sslMode=REQUIRED
# MariaDB: jdbc:mariadb://HOST:3306/BASE
db.url=jdbc:mysql://HOST:3306/BASE?sslMode=REQUIRED
db.user=USUARIO_DE_LA_BASE
db.password=CAMBIAR
# Carpeta privada, compartida por las instalaciones de escritorio del equipo.
storage.path=data/archivos
# Multimedia pública de propiedades (el preset debe estar en modo Unsigned).
cloudinary.cloud_name=evcpusrx
cloudinary.upload_preset=inmuebles_unsigned
# URL HTTPS del backend compartido desplegado (no la URL de Cloudinary).
private_media.api_url=https://TU-SERVIDOR.example.com
