# Copiar a config.properties para conectar una base MySQL o MariaDB migrada.
# Sin config.properties se utiliza una base H2 local persistente con datos de ejemplo.
# MySQL remoto: jdbc:mysql://HOST:3306/BASE?sslMode=REQUIRED
# MariaDB: jdbc:mariadb://HOST:3306/BASE
# También se pueden definir DB_URL, DB_USER y DB_PASSWORD como variables de entorno.
db.url=jdbc:mysql://HOST:3306/BASE?sslMode=REQUIRED
db.user=USUARIO_DE_LA_BASE
db.password=CAMBIAR
# Carpeta persistente privada. STORAGE_PATH como variable de entorno tiene prioridad.
storage.path=data/archivos
# Los archivos de propiedades y documentos quedan bajo esta carpeta.
# Conservá la estructura al respaldar o trasladar la base de datos.
# Opcional: ruta física accesible desde la computadora que ejecuta la app.
# MEDIA_WEB_ROOT como variable de entorno tiene prioridad.
# Las fotos/videos públicos se guardan en archivos/ y usan rutas web públicas.
# Los documentos privados permanecen en storage.path.
# media.web.root=C:/xampp/htdocs/Inmobiliaria
# media.web.prefix=/Inmobiliaria/
# MEDIA_WEB_PREFIX como variable de entorno tiene prioridad.
# Multimedia central en el hosting: cargar server-api/media.php en Inmobiliaria/api/media.php.
media.api.url=https://imbnuevohogar.cavernservices.org/Inmobiliaria/api/media.php
media.web.url=https://imbnuevohogar.cavernservices.org
